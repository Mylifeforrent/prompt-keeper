      <stop offset="1" stop-color="#6D68FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
