<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-label="Prompt Keeper — one library for every AI coding asset">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080D18"/>
      <stop offset="0.55" stop-color="#0C1226"/>
      <stop offset="1" stop-color="#141A44"/>
    </linearGradient>
    <linearGradient id="mark" x1="80" y1="64" x2="138" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C78FF"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="270" x2="760" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4E2FF"/>
      <stop offset="0.62" stop-color="#B8B3FF"/>
      <stop offset="1" stop-color="#8DF0CE"/>
    </linearGradient>
    <linearGradient id="window" x1="890" y1="100" x2="1510" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111C34"/>
      <stop offset="1" stop-color="#0C1528"/>
    </linearGradient>
    <linearGradient id="selected" x1="1040" y1="250" x2="1240" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#232A63"/>
      <stop offset="1" stop-color="#1A204B"/>
    </linearGradient>
    <linearGradient id="button" x1="1270" y1="430" x2="1450" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D68FF"/>
      <stop offset="1" stop-color="#5046E5"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="0.5" cy="0.5" r="0.5">
