<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-label="How Prompt Keeper connects a Git repository, a local asset library, and AI coding agents">
  <defs>
    <linearGradient id="wfBg" x1="0" y1="0" x2="1600" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="0.5" stop-color="#0C1428"/>
      <stop offset="1" stop-color="#121A38"/>
    </linearGradient>
    <linearGradient id="wfAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B8AFF"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="wfPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121C33"/>
      <stop offset="1" stop-color="#0E1729"/>
    </linearGradient>
    <filter id="wfShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#020510" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="620" rx="24" fill="url(#wfBg)"/>
  <rect x="0.5" y="0.5" width="1599" height="619" rx="23.5" fill="none" stroke="#29365B"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <!-- Header -->
    <rect x="60" y="48" width="184" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#33406B"/>
    <circle cx="78" cy="62" r="4" fill="#5EEAD4"/>
    <text x="90" y="66.5" font-size="11" font-weight="650" letter-spacing="1.6" fill="#A9B5D6">THE LOOP</text>
    <text x="60" y="118" font-size="34" font-weight="700" letter-spacing="-1.1" fill="#F4F7FF">Git in. Every Agent in sync.</text>
    <text x="60" y="148" font-size="15.5" fill="#97A5C6">One reviewable flow from your team repository to each tool's native configuration.</text>

    <!-- Column 1 -->
    <g filter="url(#wfShadow)">
      <rect x="60" y="186" width="366" height="330" rx="18" fill="url(#wfPanel)" stroke="#29365B"/>
    </g>
    <text x="86" y="220" font-size="11" font-weight="700" letter-spacing="1.8" fill="#8B8AFF">01 · SHARED SOURCE</text>
    <text x="86" y="254" font-size="23" font-weight="650" letter-spacing="-0.5" fill="#EDF1FA">Git repository</text>
    <text x="86" y="280" font-size="14" fill="#93A1C2">Your team's reviewable source of truth.</text>

    <rect x="86" y="300" width="314" height="176" rx="12" fill="#0A1324" stroke="#223154"/>
    <circle cx="110" cy="324" r="2.4" fill="#B8B3FF"/>
    <circle cx="102" cy="338" r="2.4" fill="#B8B3FF"/>
    <circle cx="118" cy="338" r="2.4" fill="#B8B3FF"/>
    <path d="M110 327v9M102 340h-2v-1.5M118 340h2v-1.5" stroke="#B8B3FF" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <text x="134" y="332" font-size="12.5" font-weight="600" fill="#C7D1E8">main · 2,184 commits</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#9AA8C8">
      <text x="104" y="366">prompts/</text>
      <text x="104" y="390">instructions/</text>
      <text x="104" y="414">skills/</text>
      <text x="104" y="438">mcp/</text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#5C6C91">
      <text x="252" y="366">*.prompt.md</text>
      <text x="252" y="390">*.contract.md</text>
      <text x="252" y="414">*/SKILL.md</text>
      <text x="252" y="438">*.json · ${VAR}</text>
    </g>
    <path d="M86 452h314" stroke="#1F2C4B"/>
    <circle cx="106" cy="462" r="3" fill="#34D399"/>
    <text x="118" y="466" font-size="11.5" fill="#8FA0C2">Pull requests, history, and per-item review</text>

    <!-- Arrow 1 -->
    <path d="M452 346h94" stroke="#4A5A85" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M540 340l8 6-8 6" fill="none" stroke="#8B8AFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="452" y="320" font-size="12.5" font-weight="600" fill="#8B8AFF">fetch · pull · push</text>
    <text x="452" y="376" font-size="11.5" fill="#7282A8">three-way review</text>
    <text x="452" y="394" font-size="11.5" fill="#7282A8">no auto-merge</text>

    <!-- Column 2 -->
    <g filter="url(#wfShadow)">
      <rect x="580" y="186" width="412" height="330" rx="18" fill="url(#wfPanel)" stroke="#29365B"/>
    </g>
    <text x="606" y="220" font-size="11" font-weight="700" letter-spacing="1.8" fill="#5EEAD4">02 · LOCAL CONTROL PLANE</text>
    <text x="606" y="254" font-size="23" font-weight="650" letter-spacing="-0.5" fill="#EDF1FA">Local asset library</text>
    <text x="606" y="280" font-size="14" fill="#93A1C2">SQLite, blobs, versions, and offline search.</text>

    <g>
      <rect x="606" y="300" width="168" height="54" rx="10" fill="#141F38" stroke="#283753"/>
      <circle cx="624" cy="318" r="4" fill="#8B5CF6"/>
      <text x="636" y="322.5" font-size="13" font-weight="600" fill="#D6DEF1">Prompts</text>
      <text x="624" y="341" font-size="10.5" fill="#7686A9">variables · versions</text>

      <rect x="786" y="300" width="180" height="54" rx="10" fill="#141F38" stroke="#283753"/>
      <circle cx="804" cy="318" r="4" fill="#38BDF8"/>
      <text x="816" y="322.5" font-size="13" font-weight="600" fill="#D6DEF1">Instructions</text>
      <text x="804" y="341" font-size="10.5" fill="#7686A9">scope · priority</text>

      <rect x="606" y="364" width="168" height="54" rx="10" fill="#141F38" stroke="#283753"/>
      <circle cx="624" cy="382" r="4" fill="#34D399"/>
      <text x="636" y="386.5" font-size="13" font-weight="600" fill="#D6DEF1">Skills</text>
      <text x="624" y="405" font-size="10.5" fill="#7686A9">multi-file · scripts</text>

      <rect x="786" y="364" width="180" height="54" rx="10" fill="#141F38" stroke="#283753"/>
      <circle cx="804" cy="382" r="4" fill="#FBBF24"/>
      <text x="816" y="386.5" font-size="13" font-weight="600" fill="#D6DEF1">MCP servers</text>
      <text x="804" y="405" font-size="10.5" fill="#7686A9">encrypted secrets</text>
    </g>

    <rect x="606" y="436" width="112" height="26" rx="13" fill="#1A2444" stroke="#33406B"/>
    <text x="622" y="453.5" font-size="10.5" font-weight="600" fill="#B9BDF0">Preview first</text>
    <rect x="726" y="436" width="104" height="26" rx="13" fill="#1A2444" stroke="#33406B"/>
    <text x="742" y="453.5" font-size="10.5" font-weight="600" fill="#B9BDF0">Drift aware</text>
    <rect x="838" y="436" width="104" height="26" rx="13" fill="#1A2444" stroke="#33406B"/>
    <text x="854" y="453.5" font-size="10.5" font-weight="600" fill="#B9BDF0">Rollback</text>
    <rect x="606" y="476" width="360" height="26" rx="8" fill="#0F2A25" stroke="#1F5E4C"/>
    <path d="M622 483v8m0-8h6a3 3 0 0 1 0 6h-6" stroke="#8CE8C4" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <text x="640" y="493" font-size="10.5" font-weight="600" fill="#8CE8C4">The library is local. Secrets never enter Git.</text>

    <!-- Arrow 2 -->
    <path d="M1000 346h94" stroke="#4A5A85" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M1088 340l8 6-8 6" fill="none" stroke="#5EEAD4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1000" y="320" font-size="12.5" font-weight="600" fill="#5EEAD4">project · dispatch</text>
    <text x="1000" y="376" font-size="11.5" fill="#7282A8">native formats</text>
    <text x="1000" y="394" font-size="11.5" fill="#7282A8">exact paths</text>

    <!-- Column 3 -->
    <g filter="url(#wfShadow)">
      <rect x="1128" y="186" width="412" height="330" rx="18" fill="url(#wfPanel)" stroke="#29365B"/>
    </g>
    <text x="1154" y="220" font-size="11" font-weight="700" letter-spacing="1.8" fill="#F6CF7C">03 · DELIVERY</text>
    <text x="1154" y="254" font-size="23" font-weight="650" letter-spacing="-0.5" fill="#EDF1FA">AI coding agents</text>
    <text x="1154" y="280" font-size="14" fill="#93A1C2">Each tool receives what it actually reads.</text>

    <g font-size="12.5" fill="#CDD7EC">
      <rect x="1154" y="300" width="174" height="40" rx="9" fill="#141F38" stroke="#283753"/>
      <circle cx="1172" cy="320" r="3.2" fill="#34D399"/>
      <text x="1184" y="324.5">Claude Code</text>

      <rect x="1340" y="300" width="174" height="40" rx="9" fill="#141F38" stroke="#283753"/>
      <circle cx="1358" cy="320" r="3.2" fill="#34D399"/>
      <text x="1370" y="324.5">Codex CLI</text>

      <rect x="1154" y="350" width="174" height="40" rx="9" fill="#141F38" stroke="#283753"/>
      <circle cx="1172" cy="370" r="3.2" fill="#FBBF24"/>
      <text x="1184" y="374.5">Cursor</text>

      <rect x="1340" y="350" width="174" height="40" rx="9" fill="#141F38" stroke="#283753"/>
      <circle cx="1358" cy="370" r="3.2" fill="#34D399"/>
      <text x="1370" y="374.5">Windsurf</text>

      <rect x="1154" y="400" width="174" height="40" rx="9" fill="#141F38" stroke="#283753"/>
      <circle cx="1172" cy="420" r="3.2" fill="#34D399"/>
      <text x="1184" y="424.5">OpenCode</text>

      <rect x="1340" y="400" width="174" height="40" rx="9" fill="#141F38" stroke="#283753"/>
      <circle cx="1358" cy="420" r="3.2" fill="#F87171"/>
      <text x="1370" y="424.5">Cline</text>

      <rect x="1154" y="450" width="174" height="40" rx="9" fill="#141F38" stroke="#283753"/>
      <circle cx="1172" cy="470" r="3.2" fill="#4C5B80"/>
      <text x="1184" y="474.5">Kiro</text>

      <rect x="1340" y="450" width="174" height="40" rx="9" fill="#141F38" stroke="#283753"/>
      <circle cx="1358" cy="470" r="3.2" fill="#34D399"/>
      <text x="1370" y="474.5">Qoder</text>
    </g>

    <!-- Legend -->
    <g font-size="10.5" fill="#7686A9">
      <circle cx="1158" cy="536" r="3" fill="#34D399"/>
      <text x="1168" y="540">synced</text>
      <circle cx="1228" cy="536" r="3" fill="#FBBF24"/>
      <text x="1238" y="540">stale</text>
      <circle cx="1290" cy="536" r="3" fill="#F87171"/>
      <text x="1300" y="540">drifted</text>
      <circle cx="1362" cy="536" r="3" fill="#4C5B80"/>
      <text x="1372" y="540">not installed</text>
    </g>

    <!-- Footer -->
    <path d="M60 566h1480" stroke="#1E2B49"/>
    <text x="60" y="594" font-size="11.5" fill="#6E7DA1">One-way writes · atomic rename · manifest-tracked · audit trail · item-level rollback</text>
    <text x="1540" y="594" font-size="11.5" text-anchor="end" fill="#6E7DA1">No hosted service · no account · works offline</text>
  </g>
</svg>
