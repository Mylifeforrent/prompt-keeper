appId: com.promptkeeper.app
productName: Prompt Keeper
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
npmRebuild: true
afterPack: build/afterPack.cjs
mac:
  target:
    - dmg
    - zip
  artifactName: Prompt-Keeper-${version}-${arch}-mac.${ext}
  category: public.app-category.developer-tools
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
portable:
  artifactName: Prompt-Keeper-${version}-${arch}-portable.${ext}
linux:
  target:
    - AppImage
