    <path d="M109 78c1.1 0 2 .7 2.5 2.1l3.4 9.6c.6 1.8 1.1 2.3 2.9 2.9l9.6 3.4c1.4.5 2.1 1.4 2.1 2.5s-.7 2-2.1 2.5l-9.6 3.4c-1.8.6-2.3 1.1-2.9 2.9l-3.4 9.6c-.5 1.4-1.4 2.1-2.5 2.1s-2-.7-2.5-2.1l-3.4-9.6c-.6-1.8-1.1-2.3-2.9-2.9l-9.6-3.4c-1.4-.5-2.1-1.4-2.1-2.5s.7-2 2.1-2.5l9.6-3.4c1.8-.6 2.3-1.1 2.9-2.9l3.4-9.6c.5-1.4 1.4-2.1 2.5-2.1Z" fill="#FFFFFF"/>
