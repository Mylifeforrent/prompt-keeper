    <text x="80" y="358" font-size="18.5" font-weight="400" letter-spacing="-0.1" fill="#B7C2DE">
      <tspan x="80" dy="0">Prompts, Agent Instructions, Skills, and MCP servers —</tspan>
      <tspan x="80" dy="29">versioned in Git and delivered to the tools that read them,</tspan>
      <tspan x="80" dy="29">with preview, drift protection, and rollback.</tspan>
    </text>

